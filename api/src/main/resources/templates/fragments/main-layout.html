<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title></title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <link href="../static/css/layout.css" rel="stylesheet"/>
</head>

<body style="background-color: #f4f4f4; margin: 0 !important; padding: 0 !important;">

<!-- Email Template Fragment -->
<div th:fragment="emailTemplate(headerText, preheaderText, messageText, buttonText, buttonLink)">
    <!-- HIDDEN PREHEADER TEXT -->
    <div style="display: none; font-size: 1px; color: #fefefe; line-height: 1px; font-family: 'Lato', Helvetica, Arial, sans-serif; max-height: 0px; max-width: 0px; opacity: 0; overflow: hidden;"
         th:text="${preheaderText}">
    </div>

    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <!-- LOGO -->
        <tr>
            <td th:bgcolor="${backgroundColor}" align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td align="center" valign="top" style="padding: 40px 10px 40px 10px;"></td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- HEADER -->
        <tr>
            <td th:bgcolor="${backgroundColor}" align="center" style="padding: 0px 10px 0px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#ffffff" align="center" valign="top"
                            style="padding: 40px 20px 20px 20px; border-radius: 8px 8px 0px 0px; color: #111111; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 48px; font-weight: 400; letter-spacing: 4px; line-height: 48px;">
                            <h1 style="font-size: 48px; font-weight: 400; margin: 2;" th:text="${headerText}"></h1>
                            <!-- Logo embedded inline (CID) so email clients do not block it. -->
                            <img src="cid:logo"
                                 width="150" height="150"
                                 style="display: block; border: 0px; border-radius: 8px;"/>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- MESSAGE CONTENT -->
        <tr>
            <td bgcolor="#f4f4f4" align="center" style="padding: 0px 10px 0px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 20px 30px 40px 30px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; line-height: 25px;">
                            <p style="margin: 0;" th:utext="${messageText}"></p>
                        </td>
                    </tr>

                    <!-- BUTTON -->
                    <tr th:if="${buttonText} != null and ${buttonLink} != null">
                        <td bgcolor="#ffffff" align="left">
                            <table width="100%" border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td bgcolor="#ffffff" align="center" style="padding: 20px 30px 60px 30px;">
                                        <table border="0" cellspacing="0" cellpadding="0">
                                            <tr>
                                                <td align="center" style="border-radius: 10px;"
                                                    th:bgcolor="${backgroundColor}">
                                                    <a th:href="${buttonLink}" target="_blank"
                                                       style="font-size: 20px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; color: #ffffff; text-decoration: none; padding: 15px 25px; border-radius: 8px; display: inline-block;"
                                                       th:text="${buttonText}"></a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- SIGNATURE -->
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 0px 30px 40px 30px; border-radius: 0px 0px 8px 8px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 400; line-height: 25px;">
                            <p style="margin: 0;" th:text="#{grashTeam(${brandConfig.getShortName()})}"><br></p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
        

        <!-- FOOTER SPACING -->
        <tr>
            <td bgcolor="#f4f4f4" align="center" style="padding: 0px 10px 0px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#f4f4f4" align="left"
                            style="padding: 0px 30px 30px 30px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; line-height: 18px;">
                            <br>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>

<!-- App download + server configuration section (invite / welcome emails) -->
<div th:fragment="appSection(apkUrl, serverUrl)">
    <table border="0" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td th:bgcolor="${backgroundColor}" align="center" style="padding: 0px 10px 20px 10px;">
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 30px 30px 10px 30px; border-radius: 8px 8px 0px 0px; color: #111111; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 22px; font-weight: 700;">
                            <span th:text="#{appSectionTitle}">Get the Android app</span>
                        </td>
                    </tr>
                    <!-- download intro + button -->
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 8px 30px 0px 30px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                            <p style="margin: 0;" th:text="#{appDownloadIntro}"></p>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="center" style="padding: 16px 30px 4px 30px;">
                            <table border="0" cellspacing="0" cellpadding="0">
                                <tr>
                                    <td align="center" style="border-radius: 8px;" th:bgcolor="${backgroundColor}">
                                        <a th:href="${apkUrl}" target="_blank"
                                           style="font-size: 18px; font-family: Helvetica, Arial, sans-serif; color: #ffffff; text-decoration: none; padding: 14px 24px; border-radius: 8px; display: inline-block;"
                                           th:text="#{appDownloadButton}">Download the APK</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <!-- QR -->
                    <tr>
                        <td bgcolor="#ffffff" align="center"
                            style="padding: 8px 30px 0px 30px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 20px;">
                            <p style="margin: 0 0 8px 0;" th:text="#{appQrHint}"></p>
                            <img src="cid:appQr" width="180" height="180"
                                 style="display: block; margin: 0 auto; border: 1px solid #eeeeee; border-radius: 8px;"/>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 12px 30px 20px 30px; color: #999999; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 13px; line-height: 18px;">
                            <p style="margin: 0;" th:text="#{appInstallHint}"></p>
                        </td>
                    </tr>
                    <!-- server configuration -->
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 0px 30px 6px 30px; color: #111111; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700;">
                            <span th:text="#{appConfigTitle}">Configure the server</span>
                        </td>
                    </tr>
                    <tr>
                        <td bgcolor="#ffffff" align="left"
                            style="padding: 0px 30px 30px 44px; border-radius: 0px 0px 8px 8px; color: #666666; font-family: 'Lato', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                            <ol style="margin: 0; padding: 0 0 0 16px;">
                                <li th:text="#{appConfigStep1}"></li>
                                <li th:text="#{appConfigStep2(${serverUrl})}"></li>
                                <li th:text="#{appConfigStep3}"></li>
                            </ol>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
